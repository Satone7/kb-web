version: '3.8'

services:
  kb-web:
    build: .
    container_name: kb-web
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${KB_ROOT:-./sample-kb}:/kb:ro
      - kb-data:/app/backend/data
    environment:
      - KB_ROOT=/kb
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kb-data:
